name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
        exclude:
          # Keep the matrix small: Windows only needs one PHP version to catch
          # path handling regressions.
          - os: windows-latest
            php: '7.4'
          - os: windows-latest
            php: '8.0'
          - os: windows-latest
            php: '8.2'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, tokenizer, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run the test suite
        run: composer test

      - name: Smoke test the CLI
        run: php bin/apidoc generate -c examples/apidoc.php

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: phpstan
        run: composer analyse
